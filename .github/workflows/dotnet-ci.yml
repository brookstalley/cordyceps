name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Plugin SDK (Grasshopper -> RhinoCommon) restores from nuget.org as
      # reference assemblies (ExcludeAssets=runtime), so no Rhino install is
      # needed to compile. Release is the only supported configuration.
      - name: Build plugin (Release)
        run: dotnet build src/Cordyceps/Cordyceps.csproj -c Release

      - name: Run tests (Release)
        run: dotnet test src/Cordyceps.Tests/Cordyceps.Tests.csproj -c Release

      # Publishes the built plugin on the run page so a tester without a .NET toolchain can pick
      # up a build of any commit. This is a convenience, not the distribution channel: artifacts
      # expire and need a GitHub login. Released builds come from the Releases page or Yak.
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cordyceps.gha-${{ github.sha }}
          path: src/Cordyceps/bin/Release/net8.0/Cordyceps.gha
          if-no-files-found: error
          retention-days: 90
